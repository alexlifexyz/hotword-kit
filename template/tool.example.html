<label for="input" style="display:block;font-weight:600;margin-bottom:8px">Enter your text</label>
<textarea id="input" rows="4" placeholder="Type or paste here…"></textarea>
<div style="margin-top:12px"><button id="run" type="button">Generate</button></div>
<div id="output" style="margin-top:16px;white-space:pre-wrap"></div>
<script>
  document.getElementById("run").addEventListener("click", function () {
    var text = document.getElementById("input").value.trim();
    document.getElementById("output").textContent = text ? "Result: " + text : "Please enter some text first.";
  });
</script>
