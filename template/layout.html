<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
{{extraHead}}
{{analytics}}
<style>
:root{--accent:{{accent}};--bg:#ffffff;--fg:#111827;--muted:#4b5563;--line:#e5e7eb;--card:#f9fafb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--fg:#e5e7eb;--muted:#9ca3af;--line:#1f2937;--card:#111827}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:700;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:8px}
.brand img{width:24px;height:24px}
nav a{color:var(--muted);text-decoration:none;margin-left:16px;font-size:15px}
main{padding:32px 0 48px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:0 0 12px}
h2{font-size:24px;margin:48px 0 16px}
h3{font-size:17px;margin:0 0 6px}
.lead{color:var(--muted);font-size:18px;margin:0 0 24px}
.tool{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px}
.card p{margin:0;color:var(--muted)}
ol li{margin:6px 0}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);margin:8px 0 0}
.updated{color:var(--muted);font-size:14px;margin-top:32px}
.prose p,.prose li{color:var(--muted)}
button,.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
textarea,input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;padding-top:20px;padding-bottom:20px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/"><img src="/favicon.svg" alt="" width="24" height="24">{{siteName}}</a>
  <nav><a href="/#how-to">How to use</a><a href="/#faq">FAQ</a><a href="/about">About</a></nav>
</div></header>
<main><div class="wrap">
{{body}}
</div></main>
<footer><div class="wrap">
  <span>© {{year}} {{siteName}}</span>
  <span><a href="/about">About</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="mailto:{{contactEmail}}">Contact</a></span>
</div></footer>
</body>
</html>
